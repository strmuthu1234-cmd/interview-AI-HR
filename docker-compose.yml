# Production-style stack: PostgreSQL + Redis + Django (gunicorn) + Celery worker/beat + nginx (React build).
# Terminate TLS in front of this (load balancer / Caddy / Traefik) and set X-Forwarded-Proto.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /app/media
  volumes: [media:/app/media]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 180"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=INFO --concurrency=4

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=INFO

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
  media:
